name: CI

# Production builds the image from a checkout made under umask 0077 and recreates the single
# container on every new commit of main, so a broken image must fail here, before the merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Includes the vendored HCS release check and its conformance cases.
      - run: npm test
      - run: npm run hcs:trace:check

  # Deterministic agent journeys over the MCP harness: no model, no network. Any FAIL fails the job.
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eval
      # Kept so a later run can be compared with this one: npm run eval -- --compare before.json after.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: evals/results/results.json
          if-no-files-found: error

  # Drives the real /review page in headless Chromium against the real server and a
  # synthetic book. Playwright is a dependency of browser-tests/ only (docs/testing.md).
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system libraries come preinstalled in Playwright's image for the pinned
    # version, so the job does not depend on apt mirrors (an apt outage failed every run on
    # 2026-11-11). Keep the tag equal to @playwright/test in browser-tests/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser-tests/package-lock.json
            editor/package-lock.json
      # The tests start the server from src/, which needs the root dependencies.
      - run: npm ci
      # The scene editor module the server serves at /review/editor.js (not committed).
      - run: npm ci --ignore-scripts
        working-directory: editor
      - run: npm test
        working-directory: editor
      - run: npm run build
        working-directory: editor
      - run: npm ci
        working-directory: browser-tests
      - run: npx playwright test
        working-directory: browser-tests
      # The scene editor's views on desktop and phone, kept for review.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: editor-screenshots
          path: browser-tests/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-results
          path: |
            browser-tests/test-results/
            browser-tests/playwright-report/
          retention-days: 7

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: rewrite:ci
      CONTAINER: rewrite-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Mimic the server's checkout: files 0600 and directories 0700, owned by the builder.
      - name: Strip group and other permissions
        run: chmod -R go-rwx .
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Start container and wait until healthy
        run: |
          docker run -d --name "$CONTAINER" \
            --health-interval=1s --health-timeout=3s --health-retries=5 --health-start-period=5s \
            -e MCP_OAUTH_ISSUER=https://issuer.invalid \
            -e MCP_OAUTH_RESOURCE=https://rewrite.invalid/mcp \
            -e CLERK_PUBLISHABLE_KEY=pk_test_ci \
            "$IMAGE"
          deadline=$((SECONDS + 60))
          while :; do
            running=$(docker inspect -f '{{.State.Running}}' "$CONTAINER")
            health=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")
            echo "running=$running health=$health"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$running" != true ] || [ "$health" = unhealthy ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::container did not become healthy (running=$running health=$health)"
              docker logs "$CONTAINER"
              exit 1
            fi
            sleep 1
          done
      # The editor module is built inside the image, never committed: the image must serve it.
      - name: Serve the scene editor module
        run: |
          docker exec "$CONTAINER" node -e "
            require('node:http').get({ host: '127.0.0.1', port: process.env.PORT, path: '/review/editor.js', headers: { host: 'rewrite.invalid' } }, (res) => {
              let size = 0;
              res.on('data', (chunk) => { size += chunk.length; });
              res.on('end', () => {
                console.log('status=' + res.statusCode + ' type=' + res.headers['content-type'] + ' bytes=' + size);
                process.exit(res.statusCode === 200 && /^text\/javascript/.test(res.headers['content-type']) && size > 0 ? 0 : 1);
              });
            }).on('error', () => process.exit(1));
          "
      - name: Remove container
        if: always()
        run: docker rm -f "$CONTAINER" || true
